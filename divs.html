<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vusarthi Deepika builds list with divs</title>

<style>
    .flex-container {
        display: flex;
        flex-direction: row;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
    }

    .divlist {
        border: 1px solid black;
        padding: 10px;
        background-color: lightblue;
    }

    button {
        margin: 5px;
    }
</style>
</head>
<body>

<h1>Vusarthi Deepika builds list with divs</h1>

<input type="text" id="inputItem" placeholder="Enter item">

<button onclick="addEnd()">Add end</button>
<button onclick="addFront()">Add front</button>
<button onclick="removeItem()">Remove</button>

<div class="flex-container" id="container">
    <div class="divlist">Item 1</div>
    <div class="divlist">Item 2</div>
    <div class="divlist">Item 3</div>
</div>

<script>
function addEnd() {
    let inputValue = document.getElementById("inputItem").value;
    let newDiv = document.createElement("div");
    newDiv.innerHTML = inputValue;
    newDiv.className = "divlist";

    let container = document.getElementById("container");
    container.appendChild(newDiv);
}

function addFront() {
    let inputValue = document.getElementById("inputItem").value;
    let newDiv = document.createElement("div");
    newDiv.innerHTML = inputValue;
    newDiv.className = "divlist";

    let container = document.getElementById("container");
    container.insertBefore(newDiv, container.firstChild);
}

function removeItem() {
    let divListItems = document.getElementsByClassName("divlist");

    if (divListItems.length > 1) {
        divListItems[1].remove();
    } else if (divListItems.length == 1) {
        divListItems[0].remove();
    }
}
</script>

</body>
</html>
